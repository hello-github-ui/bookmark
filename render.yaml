# Render 部署配置（静态站点）
# 文档: https://render.com/docs/blueprint-spec
#
# ⚠️ 注意 Render 与 Cloudflare 的能力差异：
#   Render 的 Static Site 只能托管静态文件，跑不了 functions/ 下的 Pages Functions。
#   所以部署到 Render 后，应用会自动进入「纯本地模式」：
#     ✅ 全部界面功能、离线使用、导入导出都正常
#     ❌ 没有多设备同步、没有自动抓取网页标题、图标改走浏览器直连
#
#   想要同步，两种办法：
#     A. 直接用 Cloudflare Pages 部署（推荐，一步到位）
#     B. 前端放 Render，后端放 Cloudflare：在 Cloudflare 侧把 CORS_ORIGINS
#        设成你的 Render 域名，前端代码里把 api 的 base 改成 Cloudflare 域名。

services:
  - type: web
    name: qiyue-bookmark
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    # SPA 兜底
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
